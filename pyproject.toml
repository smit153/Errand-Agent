[project]
name = "errand-agent"
version = "0.1.0"
description = "Local, approval-gated home-service errand agent (Orange engineering assignment)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "mypy==2.4.1",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["errand_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "SIM", "RUF", "PT", "TRY", "PL"]
ignore = [
    "TRY003",   # long messages in exceptions are deliberate (user-facing text)
    "PLR0913",  # explicit keyword-heavy signatures at boundaries
    "PLR2004",  # magic values are fine in tests/specs
    "PLR0911",  # early-return decision tables (parsers, approval checks) read clearest
    "RUF001", "RUF002", "RUF003",  # ₹, en dashes and typographic quotes are intentional in user text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "PLR0917", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["errand_agent", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not ollama'"
markers = [
    "invariant: safety-critical invariant test (approval, idempotency, recovery, guardrails)",
    "scenario(id, title, expected, covers): simulated-user scenario reported in the generated eval table",
    "ollama: needs a local Ollama with the pinned embedding model; deselected by default, run with -m ollama",
]
